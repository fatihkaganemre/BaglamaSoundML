name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift runtime and iOS build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: swift --version
      - name: Test Swift package
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build release products
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Build iOS runtime without application signing
        run: |
          swift build --target BaglamaSoundML \
            --triple arm64-apple-ios16.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --scratch-path .ios-build -Xswiftc -warnings-as-errors

  python:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-22.04
          - python: '3.12'
            os: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package without private artifacts
        run: python -m pip install -e .
      - name: Install CPU training dependency for integration tests
        if: matrix.python == '3.12'
        run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Test Python code
        run: python -m unittest discover -s tests -v
      - name: Smoke test installed entry point
        run: baglama-sound --help

  javascript:
    name: Browser controller and worklet tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test browser controllers without microphone access
        run: node --test tests/*.test.cjs
