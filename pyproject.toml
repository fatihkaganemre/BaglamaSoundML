[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baglama-sound-ml"
version = "0.1.0"
description = "Local bağlama sample synthesis and a small pitch-conditioned neural timbre experiment"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
train = ["torch>=2.2,<3"]

[project.scripts]
baglama-sound = "baglama_sound_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baglama_sound_ml = ["resources/*.html", "resources/*.css", "resources/*.js", "resources/*.json"]
